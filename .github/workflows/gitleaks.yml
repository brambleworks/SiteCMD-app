name: Gitleaks

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan repo for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The gitleaks scanner is free software; only the gitleaks-action wrapper
      # demands a license once a repository is organization-owned. Running the
      # released binary directly keeps CI on the exact build developers run
      # locally (brew gitleaks), with no license and no third-party action.
      - name: Install gitleaks
        env:
          # Bump together with local installs and the checksum, which is the
          # linux_x64 line of the release's gitleaks_<version>_checksums.txt.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --retry 3 \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 gitleaks "${RUNNER_TEMP}/bin/gitleaks"
          rm -f gitleaks gitleaks.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/gitleaks" version

      # Scan exactly the commits this event introduced, the way the local push
      # gate scans origin/main..HEAD. A manual run, or a push whose previous
      # tip is unknown, scans everything reachable from the head instead.
      - name: Scan commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi
          gitleaks git --redact --no-banner --config=.gitleaks.toml --log-opts="${range}"
